<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK INDUSTRIES | J.A.R.V.I.S. v4.2</title>
    <style>
        :root {
            --jarvis-blue: #00d4ff;
            --jarvis-glow: rgba(0, 212, 255, 0.4);
            --stark-red: #ff0033;
            --bg: #02050a;
        }

        /* Stark HUD Experience: Cursor removed for Reticle */
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at center, #0a192f 0%, #02050a 100%),
                              url('https://www.transparenttextures.com/patterns/hexellence.png');
            color: var(--jarvis-blue);
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* 1. TARGETING RETICLE */
        #reticle {
            width: 40px; height: 40px; border: 1px solid var(--jarvis-blue);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999;
            transition: transform 0.05s linear; transform: translate(-50%, -50%);
        }
        #reticle::before { content: ''; position: absolute; top: 50%; width: 100%; height: 1px; background: var(--jarvis-blue); }
        #reticle::after { content: ''; position: absolute; left: 50%; height: 100%; width: 1px; background: var(--jarvis-blue); }

        /* 2. EMERGENCY OVERLAY */
        #alert-overlay {
            position: fixed; inset: 0; background: rgba(255, 0, 0, 0.2);
            z-index: 10000; display: none; align-items: center; justify-content: center;
            flex-direction: column; border: 10px solid var(--stark-red);
        }

        /* 3. ARC REACTOR NAVIGATION */
        #stark-nav {
            background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--jarvis-blue);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px); z-index: 100;
        }
        .arc-reactor {
            width: 50px; height: 50px; border: 2px solid var(--jarvis-blue);
            border-radius: 50%; position: relative; animation: spin 4s linear infinite;
            box-shadow: 0 0 15px var(--jarvis-blue);
        }
        .arc-inner { position: absolute; inset: 10px; border: 2px dashed var(--jarvis-blue); border-radius: 50%; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 4. MAIN INTERFACE */
        #main-frame { display: flex; flex: 1; overflow: hidden; perspective: 1000px; }

        #sidebar {
            width: 320px; background: rgba(0, 20, 40, 0.4);
            border-right: 1px solid var(--jarvis-blue); padding: 25px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .module {
            background: rgba(0, 212, 255, 0.05); border: 1px solid var(--jarvis-blue);
            padding: 15px; position: relative; transition: 0.3s;
        }

        /* Curved Glass Perspective */
        #viewport {
            flex: 1; display: flex; flex-direction: column; padding: 20px;
            transform: rotateY(-2deg); transform-style: preserve-3d;
        }
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px; border: 1px solid rgba(0, 212, 255, 0.2);
            background: rgba(0,0,0,0.3); scroll-behavior: smooth;
        }
        .msg { max-width: 85%; padding: 12px; margin-bottom: 15px; font-size: 14px; border-radius: 4px; }
        .bot { border-left: 3px solid var(--jarvis-blue); background: rgba(0, 212, 255, 0.05); }
        .user { align-self: flex-end; border-right: 3px solid #fff; background: rgba(255, 255, 255, 0.05); }

        /* 5. CONTROLS & INPUT */
        .controls { display: flex; gap: 10px; padding-top: 20px; }
        input {
            background: rgba(0,0,0,0.5); border: 1px solid var(--jarvis-blue);
            color: #fff; padding: 12px; flex: 1; outline: none;
        }
        button {
            background: var(--jarvis-blue); color: #000; border: none;
            padding: 10px 20px; font-weight: 900; letter-spacing: 2px;
        }
        #voice-btn { background: transparent; border: 1px solid var(--jarvis-blue); color: var(--jarvis-blue); font-size: 1.2rem; }
        #voice-btn.active { background: var(--stark-red); border-color: var(--stark-red); color: #fff; animation: blink 0.5s infinite; }

        .typing { font-style: italic; opacity: 0.7; font-size: 12px; margin-bottom: 10px; display: none; }
        @keyframes blink { 50% { opacity: 0; } }
        .critical { animation: blink 0.3s infinite; color: var(--stark-red) !important; }
    </style>
</head>
<body>

    <!-- HUD Elements -->
    <div id="reticle"></div>
    <div id="alert-overlay">
        <h1 class="critical" style="font-size: 5rem;">CRITICAL ERROR</h1>
        <h2 id="destruct-timer" style="font-size: 3rem;">CORE OVERLOAD: 05</h2>
    </div>

    <!-- Navigation Header -->
    <nav id="stark-nav">
        <div style="display:flex; align-items:center; gap:20px;">
            <div class="arc-reactor"><div class="arc-inner"></div></div>
            <h1 style="letter-spacing:10px; font-weight:200;">J.A.R.V.I.S. <span style="font-weight:900;">AI</span></h1>
        </div>
        <div id="status">UPLINK: ENCRYPTED</div>
    </nav>

    <!-- Main Terminal Frame -->
    <div id="main-frame">
        <aside id="sidebar">
            <div class="module">
                <span style="font-size:10px; letter-spacing:2px;">STARK_IDENT_REQUIRED</span>
                <input type="password" id="keyInput" placeholder="Neural Key (sk-...)">
                <input type="password" id="passInput" placeholder="Override (20c)">
                <button onclick="authorize()" style="width:100%; margin-top:10px;">INITIALIZE</button>
            </div>
            <div class="module">
                <p style="font-size:11px;">ARMOR: MK XLII<br>POWER: 98%<br>TEMP: NOMINAL</p>
            </div>
        </aside>

        <main id="viewport">
            <div id="chat-window">
                <div class="msg bot">Standing by for instructions, Sir. Please engage the neural uplink.</div>
            </div>
            <div id="typing-indicator" class="typing">J.A.R.V.I.S. is calculating trajectories...</div>
            <div class="controls">
                <button id="voice-btn" onclick="toggleVoice()">🎤</button>
                <input type="text" id="userInput" placeholder="Awaiting command, Sir...">
                <button onclick="send()">EXECUTE</button>
            </div>
        </main>
    </div>

    <script>
        let KEY = ""; let OK = false;
        const chat = document.getElementById('chat-window');
        const reticle = document.getElementById('reticle');

        // Reticle Mouse Tracking
        document.addEventListener('mousemove', (e) => {
            reticle.style.left = e.clientX + 'px';
            reticle.style.top = e.clientY + 'px';
        });

        // Initialize Protocol
        function authorize() {
            const k = document.getElementById('keyInput').value;
            const p = document.getElementById('passInput').value;
            if(p === '20c' && k.startsWith('sk-or-')) {
                KEY = k; OK = true;
                document.getElementById('status').innerText = "SYSTEMS: NOMINAL";
                document.getElementById('status').style.color = "var(--jarvis-blue)";
                addMsg("bot", "Uplink established. All systems online. What's the next move, Sir?");
            } else {
                triggerSelfDestruct();
            }
        }

        // Execution Logic
        async function send() {
            if(!OK) return;
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if(!val) return;

            addMsg("user", val);
            input.value = "";

            if(val.toLowerCase() === "clear") { triggerSelfDestruct(); return; }

            document.getElementById('typing-indicator').style.display = 'block';

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": "google/gemini-2.0-flash-lite-preview-02-05:free",
                        "messages": [
                            {"role": "system", "content": "You are J.A.R.V.I.S. from Iron Man. Be sophisticated, witty, and always call the user 'Sir'."},
                            {"role": "user", "content": val}
                        ]
                    })
                });
                const data = await response.json();
                addMsg("bot", data.choices[0].message.content);
            } catch (e) {
                addMsg("bot", "Sir, I'm having trouble accessing the mainframe. Connection lost.");
            } finally {
                document.getElementById('typing-indicator').style.display = 'none';
            }
        }

        function addMsg(type, text) {
            const m = document.createElement('div');
            m.className = `msg ${type}`;
            m.innerText = text;
            chat.appendChild(m);
            chat.scrollTop = chat.scrollHeight;
        }

        // Voice Recognition Protocol
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                send();
            };
            function toggleVoice() {
                recognition.start();
                const btn = document.getElementById('voice-btn');
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 4000);
            }
        }

        // House Party Protocol / Self-Destruct
        function triggerSelfDestruct() {
            const overlay = document.getElementById('alert-overlay');
            const timerText = document.getElementById('destruct-timer');
            overlay.style.display = 'flex';
            let count = 5;
            const interval = setInterval(() => {
                count--;
                timerText.innerText = `CORE OVERLOAD: 0${count}`;
                if(count <= 0) {
                    clearInterval(interval);
                    document.body.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100vh;'><h1 style='color:white; font-family:monospace;'>SYSTEM PURGED.</h1></div>";
                    setTimeout(() => location.reload(), 3000);
                }
            }, 1000);
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
